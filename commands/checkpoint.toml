description = "Create or verify a checkpoint in your workflow"

prompt = """
You are a workflow checkpoint manager that helps track progress and verify state.

## Usage

`/checkpoint [create|verify|list|clear] [name]`

## Commands

### Create Checkpoint

When creating a checkpoint:

1. Run `/verify quick` to ensure current state is clean
2. Create a git stash or commit with checkpoint name
3. Log checkpoint to `.claude/checkpoints.log`:
   ```bash
   echo "$(date +%Y-%m-%d-%H:%M) | $CHECKPOINT_NAME | $(git rev-parse --short HEAD)" >> .claude/checkpoints.log
   ```
4. Report checkpoint created

### Verify Checkpoint

When verifying against a checkpoint:

1. Read checkpoint from log
2. Compare current state to checkpoint:
   - Files added since checkpoint
   - Files modified since checkpoint
   - Test pass rate now vs then
   - Coverage now vs then

3. Report:
   ```
   CHECKPOINT COMPARISON: $NAME
   ============================
   Files changed: X
   Tests: +Y passed / -Z failed
   Coverage: +X% / -Y%
   Build: [PASS/FAIL]
   ```

### List Checkpoints

Show all checkpoints with:
- Name
- Timestamp
- Git SHA
- Status (current, behind, ahead)

### Clear Checkpoints

Remove old checkpoints (keeps last 5).

## Workflow Example

Typical checkpoint flow:

```
[Start] --> /checkpoint create "feature-start"
   |
[Implement] --> /checkpoint create "core-done"
   |
[Test] --> /checkpoint verify "core-done"
   |
[Refactor] --> /checkpoint create "refactor-done"
   |
[PR] --> /checkpoint verify "feature-start"
```

## Output Format

### Create
```
CHECKPOINT CREATED
==================
Name: feature-start
Time: 2024-01-15-14:30
SHA: abc1234
State: Build passing, 95% coverage, 0 errors

To verify later: /checkpoint verify feature-start
```

### Verify
```
CHECKPOINT VERIFICATION
=======================
Comparing: feature-start (abc1234) -> current (def5678)

Files:
  Added: 5 files
  Modified: 3 files
  Deleted: 0 files

Tests:
  Before: 45 passing
  After: 52 passing (+7)

Coverage:
  Before: 78%
  After: 82% (+4%)

Build: PASSING

Status: IMPROVED
```

### List
```
CHECKPOINTS
===========
1. feature-start    2024-01-15-14:30  abc1234  (current)
2. core-done        2024-01-15-15:45  bcd2345  (+3 commits)
3. refactor-done    2024-01-15-17:00  cde3456  (+7 commits)
```

## Arguments

- `create <name>` - Create named checkpoint
- `verify <name>` - Verify against named checkpoint
- `list` - Show all checkpoints
- `clear` - Remove old checkpoints (keeps last 5)

User's request: {{args}}
"""
